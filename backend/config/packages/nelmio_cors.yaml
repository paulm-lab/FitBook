# CORS : seules les origines du front sont autorisées (expression régulière CORS_ALLOW_ORIGIN,
# localhost en développement, domaine de production dans .env.local). Cookies autorisés
# (allow_credentials) pour le cookie HttpOnly du jeton JWT.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With']
        allow_credentials: true
        max_age: 3600

    paths:
        '^/api/': ~
