# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # L'API est sans état (JWT) : aucune session PHP n'est démarrée par l'application.
    session: true

    # Seuls ces noms d'hôte sont acceptés (sinon réponse 400). Les liens absolus envoyés par
    # e-mail (confirmation, mot de passe oublié) ne peuvent donc pas pointer vers un hôte
    # choisi par un attaquant via l'en-tête Host.
    trusted_hosts: '%env(TRUSTED_HOSTS)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
