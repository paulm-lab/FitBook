security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    # ROLE_ADMIN hérite de tous les autres rôles (cahier des charges § 4).
    role_hierarchy:
        ROLE_ADMIN: [ROLE_SPORTIF, ROLE_COACH, ROLE_GESTIONNAIRE]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        main:
            lazy: true
            provider: app_users
            user_checker: App\Security\UserChecker
            entry_point: App\Security\ApiAuthenticationEntryPoint
            access_denied_handler: App\Security\ApiAuthenticationEntryPoint
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: App\Security\ApiLoginSuccessHandler
                failure_handler: App\Security\ApiLoginFailureHandler

    access_control:
        - { path: ^/api/inscription$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-email$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/resend-verification$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        # Tout compte connecté, quel que soit son rôle (droits par rôle affinés en Phase 3).
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/reservations, roles: IS_AUTHENTICATED_FULLY }