security:
    password_hashers:
        # « auto » : bcrypt ou argon2 selon la plate-forme ; ré-hachage automatique à la connexion.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    # ROLE_ADMIN hérite de tous les autres rôles (cahier des charges § 4).
    role_hierarchy:
        ROLE_ADMIN: [ROLE_SPORTIF, ROLE_COACH, ROLE_GESTIONNAIRE]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        # API sans état : chaque requête est authentifiée par son jeton JWT, aucune session PHP.
        main:
            stateless: true
            provider: app_users
            user_checker: App\Security\UserChecker
            entry_point: App\Security\ApiAuthenticationEntryPoint
            access_denied_handler: App\Security\ApiAuthenticationEntryPoint

            # POST /api/login {email, password} → { token, profil } (+ cookie HttpOnly BEARER).
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\ApiLoginFailureHandler

            # Jeton lu dans « Authorization: Bearer … » ou dans le cookie BEARER.
            jwt: ~

            # Protection contre la force brute : 5 échecs par adresse e-mail et par IP en 15 minutes.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/api/inscription$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        # Tout compte connecté, quel que soit son rôle ; les droits fins sont dans les Voters.
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/reservations, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/favoris, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/seances/\d+/inscrits, roles: IS_AUTHENTICATED_FULLY }
        # Espaces réservés à un rôle (l'administrateur hérite de tous).
        - { path: ^/api/coach/, roles: ROLE_COACH }
        - { path: ^/api/gestionnaire/, roles: ROLE_GESTIONNAIRE }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        # Catalogue : lecture publique, écriture réservée aux comptes connectés (puis Voters).
        - { path: ^/api/(seances|salles|activites|disponibilites|avis), methods: [POST, PUT, PATCH, DELETE], roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/salles/\d+/(stats|reservations), roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Hachage rapide en test uniquement (le coût réel ralentirait toute la suite).
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
