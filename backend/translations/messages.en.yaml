"Ce champ doit être supérieur ou égal à {min}.": "This field must be greater than or equal to {min}."
"Ce champ doit valoir {value}.": "This field must be {value}."
"Ce champ est obligatoire.": "This field is required."
"Ce champ n’est pas accepté.": "This field is not allowed."
"Le corps de la requête ne respecte pas le format attendu.": "The request body does not match the expected format."
"nombre entier": "integer"
"nombre": "number"
"texte": "text"
"booléen": "boolean"
"objet": "object"
"liste": "list"
"ou": "or"

