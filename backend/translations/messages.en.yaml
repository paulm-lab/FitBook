# Messages de l'API, des e-mails et des notifications en anglais (UK).
#
# La clé est le message français lui-même : le français (langue par défaut) n'a donc pas de
# fichier, et une clé absente ici renvoie simplement le texte français.
# Les paramètres sont notés {nom} (même écriture dans la clé et dans la traduction).
# Vocabulaire aligné sur le front : sportif → athlete, gestionnaire → gym manager,
# séance → session, salle → gym, réservation → booking, avis → review, inscrits → attendees.

# --- Erreurs génériques (ApiException, ApiExceptionListener, ApiRequest) ---------------------
"Accès refusé.": "Access denied."
"Authentification requise.": "Authentication required."
"Certains champs sont invalides.": "Some fields are invalid."
"Requête invalide.": "Invalid request."
"Ressource introuvable.": "Resource not found."
"Méthode non autorisée.": "Method not allowed."
"La requête n’a pas pu aboutir.": "The request could not be completed."
"Le corps de la requête doit être un objet JSON valide.": "The request body must be a valid JSON object."
"Le corps de la requête doit être un JSON valide.": "The request body must be valid JSON."
"Corps JSON invalide.": "Invalid JSON body."

