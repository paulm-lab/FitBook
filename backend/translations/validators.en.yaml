# Messages des contraintes Symfony Validator (DTO de src/Dto, Assert\Callback, contrôleurs),
# traduits par le validateur lui-même dans la langue de la requête.
# La clé est le message français déclaré dans le code ; {{ limit }}, {{ min }}, {{ max }}
# sont remplacés par le validateur.

# --- Champs communs ---------------------------------------------------------------------------
"Le nom est obligatoire.": "Name is required."
"Le nom ne peut pas dépasser {{ limit }} caractères.": "Name cannot exceed {{ limit }} characters."
"La description ne peut pas dépasser {{ limit }} caractères.": "Description cannot exceed {{ limit }} characters."
"Saisissez une adresse e-mail valide.": "Enter a valid email address."
"Saisissez un numéro de téléphone valide.": "Enter a valid phone number."
"La latitude doit être comprise entre {{ min }} et {{ max }}.": "Latitude must be between {{ min }} and {{ max }}."
"La longitude doit être comprise entre {{ min }} et {{ max }}.": "Longitude must be between {{ min }} and {{ max }}."
"La salle est invalide.": "The gym is invalid."
"L’activité est invalide.": "The activity is invalid."
"Niveau attendu : debutant, intermediaire ou avance.": "Expected level: debutant, intermediaire or avance."

