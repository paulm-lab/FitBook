# =============================================================================
# FitBook — services de développement : MySQL 8, phpMyAdmin, Mailpit
# =============================================================================
# 1. Copier .env.example en .env (non versionné) et y choisir les mots de passe.
# 2. docker compose up -d
# 3. Dans backend/.env.local :
#      DATABASE_URL="mysql://fitbook_user:<FITBOOK_DB_PASSWORD>@127.0.0.1:3307/fitbook?serverVersion=8.0.32&charset=utf8mb4"
#      MAILER_DSN=smtp://127.0.0.1:1025
#
# Ports exposés sur 127.0.0.1 uniquement (pas d'accès depuis le réseau) :
#   MySQL 3307 (pour ne pas entrer en conflit avec un MySQL local sur 3306),
#   phpMyAdmin 8080, Mailpit 8025 (interface) et 1025 (SMTP).
# =============================================================================

services:
    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définissez MYSQL_ROOT_PASSWORD dans .env}
            FITBOOK_DB_PASSWORD: ${FITBOOK_DB_PASSWORD:?Définissez FITBOOK_DB_PASSWORD dans .env}
        command:
            - --default-storage-engine=InnoDB
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        ports:
            - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            # Au premier démarrage : bases fitbook / fitbook_test et utilisateur fitbook_user.
            - ./database/scripts/create_user.sql:/fitbook/create_user.sql:ro
            - ./database/scripts/docker-init.sh:/docker-entrypoint-initdb.d/10-fitbook-user.sh:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            interval: 10s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:5
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            PMA_HOST: mysql
        ports:
            - "127.0.0.1:8080:80"

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - "127.0.0.1:8025:8025"
            - "127.0.0.1:1025:1025"

volumes:
    mysql_data:
